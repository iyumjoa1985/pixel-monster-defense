<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>픽셀 몬스터 디펜스</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="stat">💰 골드 <span id="gold">120</span></div>
      <div class="stat">❤️ 생명 <span id="lives">10</span></div>
      <div class="stat">🌊 웨이브 <span id="wave">0</span></div>
      <div class="stat">👾 남은 몬스터 <span id="enemies">0</span></div>
      <div class="stat">⚔️ 처치 <span id="kills">0</span></div>
      <div class="stat">🌱 타워 <span id="towers">0</span></div>
      <div class="controls">
        <button id="btnStart">웨이브 시작</button>
        <button id="btnPause">일시정지</button>
        <button id="btnSpeed">배속 x1</button>
      </div>
    </header>

    <div id="panel">
      <canvas id="towerIcon" width="36" height="36"></canvas>
      <div>
        <div><b>새싹이</b> · 가격 <span id="towerCost">50골드</span> · 사거리 2.5칸 · 공격력 6 · 0.6초마다 씨앗 발사</div>
        <div class="help">풀밭 클릭: 심기 &nbsp;|&nbsp; 타워 클릭: 사거리 보기 &nbsp;|&nbsp; 타워 오른쪽 클릭: 팔기(35골드 환불)</div>
      </div>
    </div>

    <div id="stage">
      <canvas id="game" width="640" height="480"></canvas>
      <div id="overlay" class="hidden">
        <div class="panel">
          <h1 id="overlayTitle">패배!</h1>
          <p id="overlayText">몬스터가 마을에 도착했어요.</p>
          <button id="btnRestart">다시 시작</button>
        </div>
      </div>
    </div>

    <p id="hint">몬스터들이 길을 따라 마을로 걸어옵니다. 마을에 도착하면 생명이 1 줄어요. 몬스터를 물리치면 골드를 받고, 그 골드로 새싹이를 더 심어서 막아보세요!</p>
    <pre id="errlog" hidden></pre>
  </div>

  <script src="js/sprites.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
